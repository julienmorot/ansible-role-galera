---

- name: Stop service Mariadb on all nodes except bootstrap node
  ansible.builtin.service:
    name: "{{ mariadb_service_name }}"
    state: stopped
  when: galera_stop == true and ansible_hostname != galera_bootstrap_node
  tags: galera_stop

- name: Stop service Mariadb on bootstrap node
  ansible.builtin.service:
    name: "{{ mariadb_service_name }}"
    state: stopped
  when: galera_stop == true and ansible_hostname == galera_bootstrap_node
  tags: galera_stop

